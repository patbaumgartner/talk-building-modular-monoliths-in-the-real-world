spring.application.name=modulith-step6-observability

# Module-level Flyway migrations
spring.modulith.runtime.flyway-enabled=true
spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.events.republish-outstanding-events-on-restart=true
spring.sql.init.mode=never

# Actuator
management.endpoints.web.exposure.include=modulith,health

# H2 Console
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver

# OpenTelemetry / Tracing
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.otlp.metrics.export.enabled=false
logging.pattern.correlation=[${spring.application.name:},%mdc{traceId:-},%mdc{spanId:-}] 

# Docker Compose
spring.docker.compose.stop.command=down

# JDBC Observation
jdbc.datasource-proxy.query.enable-logging=true
jdbc.datasource-proxy.query.log-level=INFO
jdbc.datasource-proxy.include-parameter-values=true
